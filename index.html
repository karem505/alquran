<!doctype html><html dir="rtl" lang="ar"><meta charset="utf-8"><title>مستودع القرآن الكريم — pacman</title>
<body style="font-family:sans-serif;max-width:640px;margin:40px auto;padding:0 16px">
<h1>القرآن الكريم — مستودع pacman</h1>
<p>أضف إلى <code>/etc/pacman.conf</code>:</p>
<pre>[alquran]
SigLevel = Optional TrustAll
Server = https://karem505.github.io/alquran/x86_64</pre>
<p>ثم: <code>sudo pacman -Sy alquran</code></p>
<p>المشروع: <a href="https://github.com/karem505/alquran">github.com/karem505/alquran</a></p>
</body></html>
